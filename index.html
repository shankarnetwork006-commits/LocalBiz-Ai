<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7a461d">
<meta name="description" content="Time Quest - an educational adventure exploring life around 3000 years ago.">
<link rel="manifest" href="manifest.json">
<title>Time Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#fff}
header{padding:25px 18px;text-align:center;background:linear-gradient(135deg,#623817,#d98b32);position:sticky;top:0;z-index:5}
h1{margin:0;font-size:32px}.sub{opacity:.9}.wrap{max-width:980px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
button{border:0;border-radius:14px;padding:12px 16px;background:#f4b942;color:#171717;font-weight:800;cursor:pointer}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.stat{background:#1c293c;padding:10px 16px;border-radius:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#1a2638;border:1px solid #34445c;border-radius:20px;padding:18px}.icon{font-size:44px}
.card h2{margin:7px 0}.muted{opacity:.75}.hidden{display:none}
.option{display:block;width:100%;margin:9px 0;text-align:left}.correct{background:#4caf50;color:#fff}.wrong{background:#d9534f;color:#fff}
.progress{height:11px;background:#34445c;border-radius:20px;overflow:hidden}.bar{height:100%;background:#f4b942;width:0;transition:.3s}
.badge{font-size:42px}.small{font-size:13px;opacity:.7}footer{text-align:center;padding:30px;opacity:.65}
@media(max-width:600px){h1{font-size:27px}.card{padding:15px}}
</style>
</head>
<body>
<header><h1>⏳ TIME QUEST</h1><div class="sub" id="sub">Explore the world around 3000 years ago</div></header>
<div class="wrap">
<div class="top"><strong id="welcome">🌍 Choose an adventure</strong><button onclick="toggleLang()" id="lang">తెలుగు</button></div>
<div class="stats">
<div class="stat">🪙 <span id="coins">0</span></div><div class="stat">🏆 XP <span id="xp">0</span></div><div class="stat">⭐ Level <span id="level">1</span></div>
</div>
<div class="grid" id="quests"></div>
<section id="game" class="card hidden" style="margin-top:16px">
<h2 id="gameTitle"></h2><p id="question"></p><div id="options"></div><p id="feedback"></p>
<button onclick="closeGame()">← <span id="back">Back</span></button>
</section>
<h2>🏅 <span id="badgesTitle">Badges</span></h2><div class="grid" id="badges"></div>
<h2>📊 <span id="progressTitle">Progress</span></h2><div class="progress"><div class="bar" id="bar"></div></div>
<p class="small" id="accuracyNote">Educational content is simplified for children; historical details can vary by region.</p>
</div>
<footer>TIME QUEST • Educational adventure • 2026</footer>
<script>
const quests=[
{id:"city",icon:"🏛️",en:"Ancient City",te:"ప్రాచీన నగరం",descEn:"Explore early settlements and cities.",descTe:"ప్రాచీన నివాసాలు, నగరాల గురించి తెలుసుకోండి.",qEn:"Why were many early settlements built near rivers?",qTe:"చాలా ప్రాచీన నివాసాలు నదుల దగ్గర ఎందుకు ఏర్పడ్డాయి?",optsEn:["Water and farming","Airports","Electric trains"],optsTe:["నీరు మరియు వ్యవసాయం","విమానాశ్రయాలు","ఎలక్ట్రిక్ రైళ్లు"],a:0},
{id:"farm",icon:"🌾",en:"Farming",te:"వ్యవసాయం",descEn:"Discover food and farming.",descTe:"ఆహారం, వ్యవసాయం గురించి తెలుసుకోండి.",qEn:"Which activity helped communities produce food?",qTe:"ప్రజలు ఆహారం ఉత్పత్తి చేయడానికి ఏ పని సహాయపడింది?",optsEn:["Farming","Using smartphones","Online shopping"],optsTe:["వ్యవసాయం","స్మార్ట్‌ఫోన్లు వాడటం","ఆన్‌లైన్ షాపింగ్"],a:0},
{id:"tools",icon:"⚒️",en:"Tools & Crafts",te:"పరికరాలు",descEn:"Learn about ancient tools.",descTe:"ప్రాచీన పరికరాల గురించి తెలుసుకోండి.",qEn:"Which material was widely used for early tools?",qTe:"ప్రాచీన పరికరాల్లో విస్తృతంగా ఉపయోగించిన పదార్థం ఏది?",optsEn:["Stone","Plastic","Computer chips"],optsTe:["రాయి","ప్లాస్టిక్","కంప్యూటర్ చిప్స్"],a:0},
{id:"animals",icon:"🐘",en:"Animals",te:"జంతువులు",descEn:"Meet animals of the ancient world.",descTe:"ప్రాచీన ప్రపంచంలోని జంతువులను తెలుసుకోండి.",qEn:"Which animal has a long trunk?",qTe:"ఏ జంతువుకు పొడవైన తొండం ఉంటుంది?",optsEn:["Elephant","Cat","Rabbit"],optsTe:["ఏనుగు","పిల్లి","కుందేలు"],a:0},
{id:"trade",icon:"🚢",en:"Trade Quest",te:"వాణిజ్యం",descEn:"Discover ancient exchange networks.",descTe:"ప్రాచీన వస్తు మార్పిడి గురించి తెలుసుకోండి.",qEn:"Why did communities trade goods?",qTe:"ప్రజలు వస్తువులను ఎందుకు మార్పిడి చేసుకునేవారు?",optsEn:["To exchange useful goods","To buy apps","To order online"],optsTe:["ఉపయోగకరమైన వస్తువులు మార్చుకోవడానికి","యాప్స్ కొనడానికి","ఆన్‌లైన్‌లో ఆర్డర్ చేయడానికి"],a:0},
{id:"compare",icon:"🗺️",en:"Then vs Now",te:"అప్పుడు vs ఇప్పుడు",descEn:"Compare ancient and modern life.",descTe:"ప్రాచీన జీవితం, ఆధునిక జీవితాన్ని పోల్చండి.",qEn:"Which item did people 3000 years ago not have?",qTe:"3000 సంవత్సరాల క్రితం ప్రజలకు ఏది ఉండేది కాదు?",optsEn:["Smartphone","Pottery","Farming"],optsTe:["స్మార్ట్‌ఫోన్","కుండలు","వ్యవసాయం"],a:0}
];
let te=false, coins=0, xp=0, done=[];
try{
  te=localStorage.getItem("tq_lang")==="te";
  coins=Math.max(0,Number(localStorage.getItem("tq_coins"))||0);
  xp=Math.max(0,Number(localStorage.getItem("tq_xp"))||0);
  const raw=JSON.parse(localStorage.getItem("tq_done")||"[]");
  done=Array.isArray(raw)?raw.filter(id=>quests.some(q=>q.id===id)):[];
}catch(e){}
function save(){
  try{
    localStorage.setItem("tq_coins",String(Math.max(0,coins)));
    localStorage.setItem("tq_xp",String(Math.max(0,xp)));
    localStorage.setItem("tq_done",JSON.stringify(done));
    localStorage.setItem("tq_lang",te?"te":"en");
  }catch(e){}
  renderStats();
}
function renderStats(){coinsEl.textContent=coins;xpEl.textContent=xp;levelEl.textContent=Math.floor(xp/100)+1;bar.style.width=(xp%100)+"%"}
const coinsEl=document.getElementById("coins"),xpEl=document.getElementById("xp"),levelEl=document.getElementById("level"),bar=document.getElementById("bar");
function render(){
document.getElementById("sub").textContent=te?"3000 సంవత్సరాల క్రితం ప్రపంచాన్ని అన్వేషించండి":"Explore the world around 3000 years ago";
document.getElementById("welcome").textContent=te?"🌍 ఒక సాహసాన్ని ఎంచుకోండి":"🌍 Choose an adventure";
document.getElementById("lang").textContent=te?"English":"తెలుగు";
document.getElementById("back").textContent=te?"వెనుకకు":"Back";
document.getElementById("badgesTitle").textContent=te?"బ్యాడ్జ్‌లు":"Badges";
document.getElementById("progressTitle").textContent=te?"ప్రగతి":"Progress";
document.getElementById("accuracyNote").textContent=te?"పిల్లల కోసం చరిత్రను సులభంగా చూపిస్తున్నాం; ప్రాంతాన్ని బట్టి వివరాలు మారవచ్చు.":"Educational content is simplified for children; historical details can vary by region.";
document.getElementById("quests").innerHTML=quests.map(x=>`<div class="card"><div class="icon">${x.icon}</div><h2>${te?x.te:x.en}</h2><p class="muted">${te?x.descTe:x.descEn}</p><button onclick="start('${x.id}')">${te?"ప్రారంభించు":"Start"}</button></div>`).join("");
document.getElementById("badges").innerHTML=`<div class="card"><div class="badge">🌾</div><b>${te?"ఫార్మర్ ఎక్స్‌ప్లోరర్":"Farmer Explorer"}</b></div><div class="card"><div class="badge">🏛️</div><b>${te?"సిటీ ఎక్స్‌ప్లోరర్":"City Explorer"}</b></div><div class="card"><div class="badge">🗺️</div><b>${te?"టైమ్ ట్రావెలర్":"Time Traveller"}</b></div>`;
renderStats();
}
function toggleLang(){te=!te;save();render()}
function start(id){
const x=quests.find(q=>q.id===id);game.classList.remove("hidden");gameTitle.textContent=x.icon+" "+(te?x.te:x.en);
question.textContent=te?x.qTe:x.qEn;feedback.textContent="";
options.innerHTML=(te?x.optsTe:x.optsEn).map((o,i)=>`<button class="option" onclick="answer('${id}',${i})">${o}</button>`).join("");
game.scrollIntoView({behavior:"smooth",block:"start"});
}
function answer(id,i){
const x=quests.find(q=>q.id===id);document.querySelectorAll(".option").forEach(b=>b.disabled=true);
if(i===x.a){
  if(!done.includes(id)){coins+=10;xp+=25;done.push(id);feedback.textContent=te?"🎉 సరైన సమాధానం! +10 coins +25 XP":"🎉 Correct! +10 coins +25 XP";}
  else{feedback.textContent=te?"✅ ఈ క్వెస్ట్ ఇప్పటికే పూర్తైంది.":"✅ Quest already completed.";}
  feedback.style.color="#7ee787";
}else{feedback.textContent=te?"💡 తప్పు. మళ్లీ ప్రయత్నించండి.":"💡 Not quite. Try another quest.";feedback.style.color="#ffb4b4"}
save();
}
function closeGame(){game.classList.add("hidden")}
render();
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
